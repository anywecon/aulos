# Remote controls reflected in the PC's state (from the event stream): play/pause, next,
# seek and volume. Works against mock-jam and the real Nuclear (needs a queue on the PC).
appId: com.anywecon.aulos
---
- runFlow: common/fresh-start.yaml
- runFlow: common/pc-pair.yaml

# Start from paused, then play and pause again.
- runFlow:
    when:
      visible:
        id: 'pc-play-pause'
        text: 'Pause'
    commands:
      - tapOn:
          id: 'pc-play-pause'
- extendedWaitUntil:
    visible:
      id: 'pc-play-pause'
      text: 'Play'
    timeout: 5000
- tapOn:
    id: 'pc-play-pause'
- extendedWaitUntil:
    visible:
      id: 'pc-play-pause'
      text: 'Pause'
    timeout: 5000

# Next (or previous when the PC is on the last track without repeat): the title changes.
# Polled from the screen; titles may contain regex characters.
- copyTextFrom:
    id: 'pc-title'
- evalScript: ${output.before = maestro.copiedText}
- tapOn:
    id: 'pc-next'
- repeat:
    times: 15
    while:
      true: ${maestro.copiedText === output.before}
    commands:
      - copyTextFrom:
          id: 'pc-title'
- runFlow:
    when:
      true: ${maestro.copiedText === output.before}
    commands:
      - tapOn:
          id: 'pc-previous'
      - repeat:
          times: 15
          while:
            true: ${maestro.copiedText === output.before}
          commands:
            - copyTextFrom:
                id: 'pc-title'
- assertTrue: ${maestro.copiedText !== output.before}

# Seek to 60 %. A real PC needs time to load the new track: a seek sent while it is still
# loading is dropped. Wait until it plays (Pause shown) with a known duration and a position
# that has started to move. Next on the last track stops the PC: start it again.
- runFlow:
    when:
      visible:
        id: 'pc-play-pause'
        text: 'Play'
    commands:
      - tapOn:
          id: 'pc-play-pause'
- extendedWaitUntil:
    visible:
      id: 'pc-play-pause'
      text: 'Pause'
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: 'pc-duration'
      text: '0:00'
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: 'pc-position'
      text: '0:00'
    timeout: 20000
- copyTextFrom:
    id: 'pc-duration'
# var, not const: the scripts below run again on every repeat, in the same scope.
- evalScript: |
    ${
      var toSeconds = function (t) {
        return t.split(':').reduce(function (total, part) {
          return total * 60 + Number(part);
        }, 0);
      };
      output.duration = maestro.copiedText;
      output.durationSeconds = toSeconds(maestro.copiedText);
    }
# The position shows whole seconds: 50-70 % is only measurable on a track of 30 s or more.
- assertTrue:
    condition: ${output.durationSeconds >= 30}
    label: The PC's current track must be at least 30 s long for the seek check
- evalScript: ${output.seekOk = false}
- tapOn:
    id: 'pc-seek'
    point: '60%,50%'
# The position arrives with the PC's next playback event: poll it for about 5 s. It must land
# near 60 % of the track (50-70 %: tap precision on the slider plus a few seconds of playback).
- repeat:
    times: 12
    while:
      true: ${!output.seekOk}
    commands:
      - waitForAnimationToEnd:
          timeout: 400
      - copyTextFrom:
          id: 'pc-position'
      - evalScript: |
          ${
            var toSeconds = function (t) {
              return t.split(':').reduce(function (total, part) {
                return total * 60 + Number(part);
              }, 0);
            };
            var share = toSeconds(maestro.copiedText) / output.durationSeconds;
            console.log('seek check: ' + maestro.copiedText + ' of ' + output.duration);
            output.seekOk = share >= 0.5 && share <= 0.7;
          }
- assertTrue: ${output.seekOk}

# Volume: set it near 80 %, then back to the middle (mock-jam starts at 50 %; on a real PC
# note the volume before the run and restore it afterwards).
- tapOn:
    id: 'pc-volume'
    point: '80%,50%'
- copyTextFrom:
    id: 'pc-volume-value'
- assertTrue: ${parseInt(maestro.copiedText, 10) >= 65}
- tapOn:
    id: 'pc-volume'
    point: '50%,50%'
- copyTextFrom:
    id: 'pc-volume-value'
- assertTrue: ${Math.abs(parseInt(maestro.copiedText, 10) - 50) <= 10}

- tapOn:
    id: 'pc-play-pause'
